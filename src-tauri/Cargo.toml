[package]
name = "md-preview"
version = "1.0.0"
description = "Lightweight cross-platform Markdown preview"
authors = ["adam"]
edition = "2021"
rust-version = "1.77.2"

# Desktop-only single-binary app (no mobile lib split needed).
[[bin]]
name = "md-preview"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = "0.29"
# Hands http(s)/mailto links to the OS default browser instead of letting the
# webview navigate away from the app.
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
